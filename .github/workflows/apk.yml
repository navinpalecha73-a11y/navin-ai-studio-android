name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Create Android app
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && echo '<meta http-equiv="refresh" content="0;url=https://navin-ai-creation-studio.lovable.app/auth">' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.navinpalecha.aistudio","appName":"NAVIN AI Studio","webDir":"www","server":{"url":"https://navin-ai-creation-studio.lovable.app/auth","androidScheme":"https"}}
          JSON
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../navin-ai-studio.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NAVIN AI Studio Android v1.0.${{ github.run_number }}
          make_latest: "true"
          files: navin-ai-studio.apk
